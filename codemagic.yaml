workflows:
  react-native-android:
    name: Z5500 Remote Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: npm install || true
      - name: Build Android APK
        script: |
          echo "Setting up standard Android project structure..."
          TARGET_DIR="."
          if [ -d "android" ]; then
            TARGET_DIR="android"
          fi
          cd "$TARGET_DIR"
          
          echo "Generating missing Gradle build engine wrapper..."
          gradle wrapper --gradle-version 8.0
          
          echo "Compiling Z-5500 Remote Application..."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
      - "**/build/outputs/apk/release/*.apk"
